<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduManager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;font-family:Arial,Tahoma;color:#172033}
.app{max-width:480px;margin:auto;min-height:100vh;background:#f7f9fc;padding-bottom:75px}
.top{height:60px;background:#1467df;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.page{padding:16px}.screen{display:none}.screen.on{display:block}.card{background:white;border:1px solid #e3e8ef;border-radius:15px;padding:15px;margin-bottom:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{font-size:25px;display:block;margin-top:8px}
.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:bold;cursor:pointer}.primary{background:#1467df;color:#fff}
.soft{background:#eaf1ff;color:#1467df}.danger{background:#ffe8e9;color:#c52f35}.full{width:100%}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.muted{font-size:12px;color:#7d8798}.title{font-size:21px;font-weight:800}
input,select{font:inherit;width:100%;padding:11px;border:1px solid #dfe5ee;border-radius:10px;background:white;margin:7px 0}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:68px;background:white;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);z-index:5}
.bottom button{border:0;background:white;color:#778195}.bottom .on{color:#1467df;font-weight:bold}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}.modal.on{display:flex}
.sheet{width:min(480px,100%);margin:auto;background:white;border-radius:18px 18px 0 0;padding:18px;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:10px 15px;border-radius:10px;display:none;z-index:20}
label{font-size:12px;font-weight:bold}
</style>
</head>
<body>
<div id="login" style="min-height:100vh;display:grid;place-items:center;padding:18px">
<div class="card" style="width:min(430px,100%);padding:25px">
<h1 style="text-align:center;color:#1467df">🎓 EduManager</h1>
<p class="muted" style="text-align:center">تسجيل دخول آمن</p>
<label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email">
<label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password">
<button class="btn primary full" onclick="login()">تسجيل الدخول</button>
<button class="btn soft full" style="margin-top:8px" onclick="signup()">إنشاء حساب</button>
<p id="loginMsg" class="muted"></p>
</div></div>

<div id="app" class="app" style="display:none">
<header class="top"><b id="topTitle">Dashboard</b><button class="btn" style="background:#fff;color:#1467df" onclick="logout()">خروج</button></header>

<section id="dashboard" class="screen on page">
<div class="title">لوحة التحكم</div><p class="muted" id="userEmail"></p>
<div class="grid"><div class="card stat">👥 الطلاب<b id="tc">0</b></div><div class="card stat">👥 المجموعات<b id="gc">0</b></div></div>
<div id="dash"></div>
</section>

<section id="groups" class="screen page">
<div class="row"><div class="grow"><div class="title">المجموعات</div></div><button class="btn primary" onclick="groupModal()">+ مجموعة</button></div>
<input id="gq" placeholder="🔎 بحث" oninput="loadGroups()"><div id="groupsList"></div>
</section>

<section id="students" class="screen page">
<div class="row"><div class="grow"><div class="title">الطلاب</div></div><button class="btn primary" onclick="studentModal()">+ طالب</button></div>
<input id="sq" placeholder="🔎 بحث" oninput="loadStudents()"><div id="studentsList"></div>
</section>

<section id="attendance" class="screen page">
<div class="title">الحضور</div><select id="ag" onchange="loadAttendance()"></select>
<div id="attendanceList" class="card"></div><button class="btn primary full" onclick="saveAttendance()">حفظ الحضور</button>
</section>

<nav class="bottom">
<button class="on" data-go="dashboard" onclick="go('dashboard')">⌂<br>الرئيسية</button>
<button data-go="groups" onclick="go('groups')">👥<br>المجموعات</button>
<button data-go="students" onclick="go('students')">👤<br>الطلاب</button>
<button data-go="attendance" onclick="go('attendance')">✓<br>الحضور</button>
</nav></div>

<div id="modal" class="modal"><div class="sheet"><h3 id="mt"></h3><div id="mb"></div>
<button class="btn primary full" onclick="saveModal()">حفظ</button></div></div>
<div id="toast" class="toast"></div>

<script>
const URL='https://yklylebknbruozmmqoas.supabase.co';
const KEY='sb_publishable_zwdxwTFXW3YPqIfmNaIKLg_buLdlyGy';
const supabaseClient=window.supabase.createClient(URL,KEY);
let kind=null,edit=null,cache={groups:[],students:[],att:{}};

function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ea(x){return esc(x)}
function toast(x){const t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function loginMsg(x){document.getElementById('loginMsg').textContent=x}

async function login(){
 loginMsg('جاري الدخول...');
 const {error}=await supabaseClient.auth.signInWithPassword({email:email.value.trim(),password:password.value});
 if(error){loginMsg(error.message);return} await start();
}
async function signup(){
 const e=email.value.trim(), pw=password.value;
 if(!e || !pw){loginMsg('اكتب البريد الإلكتروني وكلمة المرور أولاً');return}
 if(pw.length<6){loginMsg('كلمة المرور يجب أن تكون 6 أحرف على الأقل');return}
 loginMsg('جاري إنشاء الحساب...');
 try{
   const request=supabaseClient.auth.signUp({
     email:e,password:pw,
     options:{emailRedirectTo:window.location.origin+window.location.pathname}
   });
   const result=await Promise.race([
     request,
     new Promise((_,reject)=>setTimeout(()=>reject(new Error('انتهت مهلة الاتصال. تأكد من الإنترنت ثم أعد المحاولة.')),20000))
   ]);
   if(result.error){loginMsg(result.error.message);return}
   loginMsg(result.data.session?'تم إنشاء الحساب ويمكنك الدخول الآن':'تم إنشاء الحساب. راجع بريدك الإلكتروني لتأكيد الحساب ثم ارجع وسجل الدخول.');
 }catch(err){loginMsg(err.message||'تعذر الاتصال بالخادم، أعد المحاولة');}
}
async function logout(){await supabaseClient.auth.signOut();app.style.display='none';login.style.display='grid'}
async function start(){
 const {data:{user}}=await supabaseClient.auth.getUser(); if(!user)return;
 login.style.display='none';app.style.display='block';userEmail.textContent=user.email;
 await ensureProfile(user); await loadAll();
}
async function ensureProfile(u){
 let {data}=await supabaseClient.from('profiles').select('id,role').eq('id',u.id).maybeSingle();
 if(!data) await supabaseClient.from('profiles').insert({id:u.id,full_name:u.email,role:'super_admin'});
 else if(data.role!=='super_admin') toast('هذا الحساب ليس Super Admin');
}
async function loadAll(){await loadGroups();await loadStudents();await loadAttendance();tc.textContent=cache.students.length;gc.textContent=cache.groups.length;dash.innerHTML=cache.groups.map(g=>`<div class="card"><b>${esc(g.name)}</b><div class="muted">${cache.students.filter(s=>s.group_id===g.id).length} طالب</div></div>`).join('')}
async function loadGroups(){
 let {data,error}=await supabaseClient.from('groups').select('*').order('created_at');
 if(error){toast(error.message);return} cache.groups=data||[];
 let q=(gq.value||'').toLowerCase();
 groupsList.innerHTML=cache.groups.filter(g=>g.name.toLowerCase().includes(q)).map(g=>`<div class="card"><b>${esc(g.name)}</b><p class="muted">${esc(g.schedule||'')}</p><button class="btn primary" onclick="groupModal('${g.id}')">✏️ تعديل</button> <button class="btn danger" onclick="delGroup('${g.id}')">حذف</button></div>`).join('');
 ag.innerHTML=cache.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');
}
async function loadStudents(){
 let {data,error}=await supabaseClient.from('students').select('*').order('created_at');
 if(error){toast(error.message);return} cache.students=data||[];let q=(sq.value||'').toLowerCase();
 studentsList.innerHTML=cache.students.filter(s=>(s.name+' '+s.student_id).toLowerCase().includes(q)).map(s=>`<div class="card"><b>${esc(s.name)}</b><div class="muted">ID: ${esc(s.student_id)} • ${esc(cache.groups.find(g=>g.id===s.group_id)?.name||'بدون مجموعة')}</div><div>${esc(s.parent_name||'-')} • ${esc(s.parent_whatsapp||'-')}</div><br><button class="btn primary" onclick="studentModal('${s.id}')">✏️ تعديل</button> <button class="btn danger" onclick="delStudent('${s.id}')">حذف</button></div>`).join('');
}
function groupModal(id){
 edit=id||null;kind='g';let g=cache.groups.find(x=>x.id===id)||{};mt.textContent=id?'تعديل المجموعة':'إضافة مجموعة';
 mb.innerHTML=`<label>اسم المجموعة</label><input id="f1" value="${ea(g.name)}"><label>المدرس</label><input id="f2" value="${ea(g.teacher_id)}"><label>الجدول</label><input id="f3" value="${ea(g.schedule)}"><label>الوقت</label><input id="f4" value="${ea(g.time)}"><label>القاعة</label><input id="f5" value="${ea(g.room)}">`;modal.classList.add('on');
}
function studentModal(id){
 edit=id||null;kind='s';let s=cache.students.find(x=>x.id===id)||{};mt.textContent=id?'تعديل الطالب':'إضافة طالب';
 mb.innerHTML=`<label>اسم الطالب</label><input id="f1" value="${ea(s.name)}"><label>Student ID</label><input id="f2" value="${ea(s.student_id)}" ${id?'readonly':''}><label>المجموعة</label><select id="f3">${cache.groups.map(g=>`<option value="${g.id}" ${g.id===s.group_id?'selected':''}>${esc(g.name)}</option>`).join('')}</select><label>ولي الأمر</label><input id="f4" value="${ea(s.parent_name)}"><label>WhatsApp</label><input id="f5" value="${ea(s.parent_whatsapp)}"><label>Email</label><input id="f6" value="${ea(s.email)}">`;modal.classList.add('on');
}
async function saveModal(){
 if(kind==='g'){
  let o={name:f1.value.trim(),teacher_id:f2.value.trim()||null,schedule:f3.value.trim(),time:f4.value.trim(),room:f5.value.trim()};
  let r=edit?await supabaseClient.from('groups').update(o).eq('id',edit):await supabaseClient.from('groups').insert(o);
  if(r.error)toast(r.error.message);else{modal.classList.remove('on');await loadAll();toast('تم حفظ المجموعة')}
 }else{
  let o={name:f1.value.trim(),student_id:f2.value.trim(),group_id:f3.value,parent_name:f4.value.trim(),parent_whatsapp:f5.value.trim(),email:f6.value.trim()};
  let r=edit?await supabaseClient.from('students').update(o).eq('id',edit):await supabaseClient.from('students').insert(o);
  if(r.error)toast(r.error.message);else{modal.classList.remove('on');await loadAll();toast('تم حفظ الطالب')}
 }
}
async function delGroup(id){if(!confirm('حذف المجموعة؟'))return;let r=await supabaseClient.from('groups').delete().eq('id',id);if(r.error)toast(r.error.message);else await loadAll()}
async function delStudent(id){if(!confirm('حذف الطالب؟'))return;let r=await supabaseClient.from('students').delete().eq('id',id);if(r.error)toast(r.error.message);else await loadAll()}
async function loadAttendance(){
 if(!cache.groups.length)return;let gid=ag.value||cache.groups[0].id;ag.value=gid;
 let {data}=await supabaseClient.from('attendance').select('*').eq('group_id',gid).eq('session_date',new Date().toISOString().slice(0,10));
 cache.att={};(data||[]).forEach(a=>cache.att[a.student_id]=a.status);
 attendanceList.innerHTML=cache.students.filter(s=>s.group_id===gid).map(s=>{let st=cache.att[s.id]||'present';return `<div style="padding:10px 0;border-bottom:1px solid #eee"><div class="row"><div class="grow"><b>${esc(s.name)}</b></div><button class="btn ${st==='present'?'primary':'soft'}" onclick="setA('${s.id}','present')">🟢</button><button class="btn ${st==='absent'?'danger':'soft'}" onclick="setA('${s.id}','absent')">🔴</button><button class="btn ${st==='late'?'primary':'soft'}" onclick="setA('${s.id}','late')">🟡</button></div></div>`}).join('');
}
function setA(id,s){cache.att[id]=s;loadAttendance()}
async function saveAttendance(){
 let gid=ag.value,date=new Date().toISOString().slice(0,10);
 for(const s of cache.students.filter(x=>x.group_id===gid)) await supabaseClient.from('attendance').upsert({student_id:s.id,group_id:gid,session_date:date,status:cache.att[s.id]||'present'},{onConflict:'student_id,session_date'});
 toast('تم حفظ الحضور Online');
}
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('on',b.dataset.go===id));topTitle.textContent={dashboard:'Dashboard',groups:'Groups',students:'Students',attendance:'Attendance'}[id];if(id==='attendance')loadAttendance()}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')modal.classList.remove('on')});
supabaseClient.auth.getSession().then(({data:{session}})=>{if(session)start()});
</script></body></html>
